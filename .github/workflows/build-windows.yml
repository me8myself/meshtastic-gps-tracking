name: Build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach the .exe to GitHub releases on version tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MeshTracker-windows
            exe: dist/MeshTracker.exe
          - os: ubuntu-latest
            artifact: MeshTracker-linux
            exe: dist/MeshTracker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest httpx

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/MeshTracker.spec

      - name: Smoke test the executable
        shell: bash
        run: python packaging/smoke_test.py "${{ matrix.exe }}"

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.exe }}" release/
          cp packaging/settings.txt release/
          cp README.md release/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.exe }}
